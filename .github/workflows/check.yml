# Export candidate only: this file is inert in the private repository.
name: Check
on:
  pull_request:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
    inputs:
      notification_drill:
        description: Fail immediately to exercise CI failure delivery
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hundred-public-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Exercise failure notification
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_EVENT_PATH']) as event_file:
              drill = json.load(event_file).get('inputs', {}).get('notification_drill')
          if drill == 'true':
              raise SystemExit('Deliberate failure notification drill.')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: scripts/test-public-tools
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libssl-dev clang cmake xvfb xdotool imagemagick tesseract-ocr jq socat mesa-vulkan-drivers
      - run: npm ci --ignore-scripts
      - run: scripts/check
      - name: Full local Worker and native acceptance
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          HUNDRED_WALK_SYNC: '1'
          WS_EVIDENCE: ${{ runner.temp }}/hundred-evidence
        run: |
          mkdir -m 700 -p "$WS_EVIDENCE"
          cargo install worker-build --version 0.8.5 --locked
          scripts/test-worker
          scripts/walk-native target/debug/hundred "$WS_EVIDENCE/native"
          cargo build --locked --release -p hundred
  notify:
    needs: check
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: hundred-ci-failure-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: scripts/notify-ci-failure
        env:
          GH_TOKEN: ${{ github.token }}
